<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Arqemio Project Update</title>
</head>

<body style="margin: 0; padding: 0; background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">

<div style="max-width: 580px; margin: 40px auto; background-color: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden;">

    <div style="background-color: #0f172a; padding: 28px 40px; border-bottom: 3px solid #2563eb;">
        <h1 style="margin: 0; color: #ffffff; font-size: 22px; font-weight: 700; letter-spacing: -0.5px;">
            Arqemio
        </h1>
    </div>

    <div style="padding: 40px; color: #334155;">

        <h2 style="margin-top: 0; margin-bottom: 20px; color: #0f172a; font-size: 24px; font-weight: 700; letter-spacing: -0.5px;">
            New project update
        </h2>

        <p style="margin: 0 0 16px 0; line-height: 1.6; font-size: 15px; color: #334155;">
            A progress update for
            <strong style="color: #0f172a;">{{projectName}}</strong>
            has been shared with you.
        </p>

        <p style="margin: 0 0 28px 0; line-height: 1.6; font-size: 15px; color: #475569;">
            {{message}}
        </p>

        <div style="margin: 0 0 28px 0;">
            <a href="{{shareLink}}"
               style="
                    background-color: #2563eb;
                    color: #ffffff;
                    padding: 14px 28px;
                    text-decoration: none;
                    border-radius: 8px;
                    display: inline-block;
                    font-weight: 600;
                    font-size: 15px;
               ">
                View Project Update
            </a>
        </div>

        <p style="margin: 0 0 12px 0; font-size: 13px; color: #64748b; font-weight: 500;">
            This secure link will expire in 24 hours.
        </p>

        <p style="margin: 0; font-size: 13px; color: #64748b;">
            You don't need an Arqemio account to view this project update.
        </p>

        <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 32px 0;">

        <p style="margin: 0; font-size: 13px; color: #94a3b8; line-height: 1.5;">
            {{companyName}}<br>
            Powered by Arqemio
        </p>

    </div>

</div>

</body>
</html>
