services:
  auth-service:
    build: ./auth-service
    restart: always
    ports:
      - "8081:8081"
    environment:
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      COMPANY_SERVICE_URL: http://company-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      CLOUDINARY_URL: ${CLOUDINARY_URL}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      jWT_SECRET: ${jWT_SECRET}
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - postgres

  company-service:
    build: ./company-service
    restart: always
    ports:
      - "8082:8082"
    environment:
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      CLOUDINARY_URL: ${CLOUDINARY_URL}
      jWT_SECRET: ${jWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:8081
      FINANCE_SERVICE_URL: http://finance-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      postgres_db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - postgres

  finance-service:
    build: ./finance-service
    restart: always
    ports:
      - "8083:8083"
    environment:
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      CLOUDINARY_URL: ${CLOUDINARY_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      jWT_SECRET: ${jWT_SECRET}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      AUTH_SERVICE_URL: http://auth-service:8081
      COMPANY_SERVICE_URL: http://company-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - postgres

  notification-service:
    build: ./notification-service
    restart: always
    ports:
      - "8084:8084"
    environment:
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      jWT_SECRET: ${jWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:8081
      COMPANY_SERVICE_URL: http://company-service:8082
      FINANCE_SERVICE_URL: http://finance-service:8083
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    depends_on:
      postgres_db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - postgres

  api-gateway:
    build: ./api-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_JSON: >-
        {"spring":{"cloud":{"gateway":{"server":{"webflux":{"routes":[
        {"id":"auth-service","uri":"http://auth-service:8081","predicates":["Path=/auth/**"]},
        {"id":"company-service","uri":"http://company-service:8082","predicates":["Path=/company/**"]},
        {"id":"finance-service","uri":"http://finance-service:8083","predicates":["Path=/finance/**"]},
        {"id":"notification-service","uri":"http://notification-service:8084","predicates":["Path=/notifications"]}
        ]}}}}}}
    depends_on:
      - auth-service
      - company-service
      - finance-service
      - notification-service
    networks:
      - postgres

  postgres_db:
    image: postgres:18.6
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: arqemio
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - postgres

  pgadmin:
    image: dpage/pgadmin4:9.18
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - postgres

  kafka:
    image: apache/kafka:4.1.0
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - postgres

networks:
  postgres:
    driver: bridge

volumes:
  postgres:
  pgadmin:
