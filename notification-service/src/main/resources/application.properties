spring.application.name=notification-service
server.port=8084
server.error.include-stacktrace=ALWAYS
spring.jpa.hibernate.ddl-auto=validate

spring.datasource.url=jdbc:postgresql://localhost:5432/arqemio
spring.datasource.username=b
spring.datasource.password=
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always
jwt-secret="57b5c7efe3dc6fb95a22f940da1b2555c5741c43d11870116f9b45e223c9d733"
jwt-expiration-ms=86400000

app.frontend-url=http://localhost:5173


auth.service.url=http://localhost:8081
company.service.url=http://localhost:8082
finance.service.url=http://localhost:8083

spring.kafka.bootstrap-servers=localhost:9092

## Producer: key is plain text, value (our event object) is converted to JSON
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

## Consumer: JSON back into an object
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.ga.notification_service.event
spring.kafka.consumer.group-id=arqemio-notification-group
spring.kafka.consumer.properties.spring.json.value.default.type=com.ga.notification_service.event.ArqemioEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.auto-offset-reset=earliest

internal.api-key=${INTERNAL_API_KEY}